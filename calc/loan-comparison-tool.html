<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Comparison Tool</title>
    <style>
        /* Add some basic styling */
        body {
            font-family: Arial, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>

</head>
<body>
    <h1>Loan Comparison Tool</h1>
    <form>
        <label for="loan-amount">Loan Amount:</label>
        <input type="number" id="loan-amount" required>
        <br>
        <label for="interest-rate">Interest Rate:</label>
        <input type="number" id="interest-rate" required>
        <br>
        <label for="loan-term">Loan Term (years):</label>
        <input type="number" id="loan-term" required>
        <br>
        <button id="calculate-btn">Calculate</button>
    </form>
    <table id="loan-details">
        <thead>
            <tr>
                <th>Loan Amount</th>
                <th>Interest Rate</th>
                <th>Loan Term</th>
                <th>Monthly Payment</th>
                <th>Total Interest</th>
            </tr>
        </thead>
        <tbody id="loan-details-body">
        </tbody>
    </table>

    <script>
        // Get the form and table elements
        const form = document.querySelector('form');
        const loanDetailsTable = document.getElementById('loan-details-body');

        // Add event listener to the form
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Get the loan details
            const loanAmount = parseFloat(document.getElementById('loan-amount').value);
            const interestRate = parseFloat(document.getElementById('interest-rate').value) / 100 / 12;
            const loanTerm = parseFloat(document.getElementById('loan-term').value) * 12;

            // Calculate the monthly payment
            const monthlyPayment = loanAmount * interestRate * (1 + interestRate) ** loanTerm / ((1 + interestRate) ** loanTerm - 1);

            // Calculate the total interest
            const totalInterest = monthlyPayment * loanTerm - loanAmount;

            // Create a new table row
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${loanAmount.toFixed(2)}</td>
                <td>${(interestRate * 12 * 100).toFixed(2)}%</td>
                <td>${loanTerm / 12} years</td>
                <td>${monthlyPayment.toFixed(2)}</td>
                <td>${totalInterest.toFixed(2)}</td>
            `;

            // Add the new row to the table
            loanDetailsTable.appendChild(row);
        });
    </script>

</body>
</html>
